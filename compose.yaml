services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TEACHER_KEY: ${TEACHER_KEY:?Run setup first}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
    volumes:
      - classroom_data:/data
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on: [app, livekit]
    ports:
      - "443:443/tcp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  classroom_data:
  caddy_data:
  caddy_config:
